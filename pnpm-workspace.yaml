packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # next@16.2.12 still bundles its own old postcss internally (separate from
  # the patched one Tailwind/Vite already use) — force it to a patched
  # version too. postcss 8.x is backward-compatible within the major.
  postcss: '^8.5.18'
  # next also bundles an old sharp (image optimization) — force the patched line.
  # 0.35.4 fixed the libheif CVEs; 0.35.5 fixes the librsvg one (GHSA-wq5f-xc86-pv6w).
  sharp: '^0.35.5'
  # js-yaml and nanoid highs from `pnpm audit` are disabled here — see
  # README.md § Security for the manual fix.
  js-yaml: '^4.3.2'
  nanoid: '^3.3.17'
  # Patched lines for transitive packages flagged by `pnpm audit` (Oct 2026).
  # Each stays inside the major version its parent package already uses.
  '@fastify/busboy': '^3.2.1'        # firebase-admin
  '@grpc/grpc-js': '^1.14.5'         # firebase / firebase-admin (Firestore)
  'body-parser@1': '^1.20.9'         # express 4 inside firebase-functions
  'body-parser@2': '^2.4.0'          # express 5 (backend)
  'brace-expansion@1': '^1.1.20'     # eslint / minimatch
  'brace-expansion@2': '^2.1.6'
  'brace-expansion@5': '^5.0.11'
  proxy-addr: '^2.0.8'               # express
  source-map-js: '^1.2.2'            # postcss

allowBuilds:
  '@firebase/util': true
  '@google/genai': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
